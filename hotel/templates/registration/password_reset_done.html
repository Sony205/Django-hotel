{% extends "base.html" %}

{% block title %}Письмо отправлено — Django-Hotel{% endblock %}

{% block content %}
<div class="page-form">

  <div class="form-wrap" style="text-align:center;">

    <!-- Иконка конверта -->
    <div style="margin-bottom:20px;">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none"
           stroke="var(--accent)" stroke-width="1.4"
           style="display:inline-block;">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
        <polyline points="22,6 12,13 2,6"/>
      </svg>
    </div>

    <h1 style="margin-bottom:14px;">Письмо отправлено</h1>

    <p style="font-size:.9rem; color:var(--muted); line-height:1.65; margin-bottom:28px;">
      Мы отправили инструкции по сбросу пароля на указанный email.<br>
      Проверьте папку «Входящие» или «Спам».
    </p>

    <a href="{% url 'login' %}" class="btn-submit"
       style="display:inline-block; width:auto; padding:10px 32px; text-decoration:none;">
      Вернуться ко входу
    </a>

  </div>
</div>
{% endblock %}
