{% extends "base.html" %}

{% block title %}Пароль изменён — Django-Hotel{% endblock %}

{% block content %}
<div class="page-form">
  <div class="form-wrap" style="text-align:center;">

    <!-- Иконка успеха -->
    <div style="margin-bottom:20px;">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none"
           stroke="#2ecc71" stroke-width="1.4"
           style="display:inline-block;">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="9 12 11 14 15 10"/>
      </svg>
    </div>

    <h1 style="margin-bottom:14px;">Пароль изменён</h1>

    <p style="font-size:.9rem; color:var(--muted); line-height:1.65; margin-bottom:28px;">
      Ваш пароль был успешно изменён.
    </p>

    <a href="{% url 'home' %}" class="btn-submit"
       style="display:inline-block; width:auto; padding:10px 32px; text-decoration:none;">
      На главную
    </a>

  </div>
</div>
{% endblock %}
